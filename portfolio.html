<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <title>Portfolio & Case Studies | Cyfer Solutions</title>
    <meta name="description" content="Explore Cyfer Solutions' portfolio of real-world digital projects from AI platforms to mobile apps and enterprise web systems. See how we turn challenges into results.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/config.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/portfolio.css">
  </head>

  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-500">

    <div id="background-placeholder" data-bg-variant="about"></div>
    <div id="header-placeholder"></div>

    <main>
      <!-- Hero -->
      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 pb-14 md:pt-14 md:pb-16 text-center">
        <div data-aos="fade-up">
          <span class="inline-block px-4 py-1.5 rounded-full bg-[#1e3a5f]/10 dark:bg-[#1e3a5f]/40 text-[#1e3a5f] dark:text-[#60a5fa] text-xs font-bold uppercase mb-5 tracking-widest">Our Work</span>
          <h1 class="text-4xl sm:text-5xl md:text-6xl font-black leading-tight mb-5">
            Portfolio &amp; <span class="animate-shine inline-block">Case Studies</span>
          </h1>
          <p class="text-lg text-slate-600 dark:text-slate-400 max-w-2xl mx-auto">
            Real projects. Real results. Explore how we've transformed businesses across healthcare, fintech, retail, and beyond.
          </p>
        </div>

        <!-- Filter tabs -->
        <div class="portfolio-filter-bar mt-10" data-aos="fade-up" data-aos-delay="150" id="portfolio-filter-bar">
          <button class="portfolio-filter-btn active" data-filter="all">All Projects</button>
          <button class="portfolio-filter-btn" data-filter="Web Application">Web Apps</button>
          <button class="portfolio-filter-btn" data-filter="Mobile Application">Mobile</button>
          <button class="portfolio-filter-btn" data-filter="AI / Machine Learning">AI &amp; ML</button>
          <button class="portfolio-filter-btn" data-filter="Cloud & DevOps">Cloud &amp; DevOps</button>
          <button class="portfolio-filter-btn" data-filter="Cyber Security">Security</button>
          <button class="portfolio-filter-btn" data-filter="UI/UX & Web">UI/UX</button>
        </div>
      </section>

      <!-- Portfolio Grid -->
      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
        <div class="portfolio-grid" id="portfolio-grid">
          <!-- Cards injected by JS -->
        </div>
      </section>

      <!-- CTA -->
      <div id="cta-placeholder" data-cta-key="portfolio"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/components.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/team-slider.js"></script>
    <script src="js/portfolio.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
